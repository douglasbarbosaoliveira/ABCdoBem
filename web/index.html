<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="abc_do_bem">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>abc_do_bem</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
   <!-- VLibras -->
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

  <script>
    new window.VLibras.Widget({
      rootPath: 'https://vlibras.gov.br/app',
      avatar: 'random',
      position: 'R'
    });
  </script>
  <script>
  window.setVlibrasButtonVisible = function (visible) {
    const button = window.VLibrasWidget?.initBtn;

    if (button) {
      button.style.display = visible ? '' : 'none';
    }

    const accessButton = document.querySelector('[vw-access-button]');

    if (accessButton) {
      accessButton.style.display = visible ? '' : 'none';
    }

    const container = document.querySelector('[vw]');

    if (container) {
      container.style.display = visible ? '' : 'none';
    }
  };
</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
